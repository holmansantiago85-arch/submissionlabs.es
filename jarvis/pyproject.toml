[project]
name = "jarvis"
version = "0.1.0"
description = "Local voice and text assistant for macOS, powered by Claude."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.4.6", "numpy>=1.26", "faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]
